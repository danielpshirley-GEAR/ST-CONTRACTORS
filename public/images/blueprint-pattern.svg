<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <!-- 20px Minor Grid -->
    <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#64748b" stroke-width="0.5" stroke-opacity="0.18" />
    </pattern>
    <!-- 100px Major Grid -->
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minorGrid)" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#475569" stroke-width="0.8" stroke-opacity="0.32" />
    </pattern>
  </defs>

  <!-- Base Grid Fill -->
  <rect width="800" height="800" fill="url(#majorGrid)" />

  <!-- Architectural Sketches Group -->
  <g stroke="#334155" stroke-opacity="0.45" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- ============================================== -->
    <!-- 1. FLOOR PLAN SECTION (Top-Left / Center Area) -->
    <!-- ============================================== -->
    
    <!-- Exterior Double Walls -->
    <rect x="60" y="60" width="340" height="280" stroke-width="2.5" />
    <rect x="68" y="68" width="324" height="264" stroke-width="1.2" />

    <!-- Interior Partition Walls -->
    <line x1="200" y1="68" x2="200" y2="240" stroke-width="2" />
    <line x1="68" y1="200" x2="200" y2="200" stroke-width="2" />
    <line x1="200" y1="180" x2="392" y2="180" stroke-width="2" />

    <!-- Door Swings -->
    <!-- Room 1 Door -->
    <path d="M 200 130 A 30 30 0 0 1 230 160" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="200" y1="130" x2="200" y2="160" stroke-width="1.5" />
    <!-- Room 2 Door -->
    <path d="M 140 200 A 30 30 0 0 1 110 230" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="140" y1="200" x2="110" y2="200" stroke-width="1.5" />

    <!-- Windows -->
    <rect x="110" y="56" width="60" height="8" fill="#cbd5e1" fill-opacity="0.4" stroke-width="1" />
    <line x1="110" y1="60" x2="170" y2="60" stroke-width="0.75" />
    <rect x="260" y="56" width="80" height="8" fill="#cbd5e1" fill-opacity="0.4" stroke-width="1" />
    <line x1="260" y1="60" x2="340" y2="60" stroke-width="0.75" />
    <rect x="388" y="100" width="8" height="50" fill="#cbd5e1" fill-opacity="0.4" stroke-width="1" />
    
    <!-- Furniture Layout Sketches (Living / Kitchen) -->
    <!-- Sofa & Coffee Table -->
    <rect x="90" y="90" width="70" height="35" rx="4" stroke-width="1" />
    <rect x="95" y="100" width="60" height="20" rx="2" stroke-width="0.75" />
    <rect x="105" y="135" width="40" height="25" rx="2" stroke-width="1" />
    <circle cx="125" cy="147" r="5" stroke-width="0.75" />

    <!-- Kitchen Island & Stools -->
    <rect x="230" y="100" width="120" height="45" rx="2" stroke-width="1.2" />
    <rect x="240" y="108" width="30" height="28" stroke-width="0.75" />
    <circle cx="255" cy="122" r="6" stroke-width="0.75" />
    <circle cx="290" cy="122" r="5" stroke-width="0.75" />
    <circle cx="315" cy="122" r="5" stroke-width="0.75" />
    <circle cx="340" cy="122" r="5" stroke-width="0.75" />
    <!-- Dining Table & Chairs -->
    <rect x="240" y="210" width="90" height="50" rx="3" stroke-width="1" />
    <circle cx="260" cy="198" r="6" stroke-width="0.75" />
    <circle cx="285" cy="198" r="6" stroke-width="0.75" />
    <circle cx="310" cy="198" r="6" stroke-width="0.75" />
    <circle cx="260" cy="272" r="6" stroke-width="0.75" />
    <circle cx="285" cy="272" r="6" stroke-width="0.75" />
    <circle cx="310" cy="272" r="6" stroke-width="0.75" />

    <!-- Bathroom / En-suite Layout -->
    <rect x="90" y="230" width="40" height="80" rx="8" stroke-width="1.2" />
    <circle cx="110" cy="250" r="4" stroke-width="0.75" />
    <rect x="150" y="275" width="35" height="35" rx="3" stroke-width="1" />
    <circle cx="167" cy="292" r="10" stroke-width="0.75" />

    <!-- Dimension Lines & Annotations -->
    <g stroke-width="0.75" stroke="#475569" stroke-opacity="0.6">
      <!-- Top Dimension -->
      <line x1="60" y1="35" x2="400" y2="35" />
      <line x1="60" y1="28" x2="60" y2="42" />
      <line x1="200" y1="28" x2="200" y2="42" />
      <line x1="400" y1="28" x2="400" y2="42" />
      <path d="M 60 35 L 68 32 M 60 35 L 68 38 M 400 35 L 392 32 M 400 35 L 392 38" />
      <text x="120" y="28" font-family="monospace" font-size="10" fill="#475569" fill-opacity="0.7" stroke="none">4.25 m</text>
      <text x="285" y="28" font-family="monospace" font-size="10" fill="#475569" fill-opacity="0.7" stroke="none">5.80 m</text>

      <!-- Left Dimension -->
      <line x1="35" y1="60" x2="35" y2="340" />
      <line x1="28" y1="60" x2="42" y2="60" />
      <line x1="28" y1="200" x2="42" y2="200" />
      <line x1="28" y1="340" x2="42" y2="340" />
      <text x="12" y="135" font-family="monospace" font-size="10" fill="#475569" fill-opacity="0.7" stroke="none" transform="rotate(-90 12 135)">3.80 m</text>
      <text x="12" y="275" font-family="monospace" font-size="10" fill="#475569" fill-opacity="0.7" stroke="none" transform="rotate(-90 12 275)">4.10 m</text>

      <!-- Room Tags -->
      <text x="105" y="180" font-family="sans-serif" font-size="9" font-weight="bold" fill="#475569" fill-opacity="0.6" stroke="none" letter-spacing="1">LIVING / 24.5 m²</text>
      <text x="260" y="165" font-family="sans-serif" font-size="9" font-weight="bold" fill="#475569" fill-opacity="0.6" stroke="none" letter-spacing="1">KITCHEN / 18.2 m²</text>
      <text x="140" y="255" font-family="sans-serif" font-size="9" font-weight="bold" fill="#475569" fill-opacity="0.6" stroke="none" letter-spacing="1">BATH / 6.4 m²</text>
    </g>

    <!-- ============================================== -->
    <!-- 2. STRUCTURAL ISOMETRIC SKETCH (Top-Right)    -->
    <!-- ============================================== -->
    <g transform="translate(480, 80)">
      <!-- Isometric Steel Beam & Slab Diagram -->
      <polygon points="120,20 260,20 200,70 60,70" stroke-width="1.5" fill="#f1f5f9" fill-opacity="0.4" />
      <polygon points="60,70 200,70 200,90 60,90" stroke-width="1.5" />
      <polygon points="200,70 260,20 260,40 200,90" stroke-width="1.5" />
      
      <!-- Supporting Columns -->
      <rect x="75" y="90" width="18" height="110" stroke-width="1.2" />
      <rect x="185" y="90" width="18" height="110" stroke-width="1.2" />
      <rect x="235" y="40" width="16" height="110" stroke-width="1.2" />

      <!-- Force Vectors / Load Arrows -->
      <g stroke="#d97706" stroke-opacity="0.6" stroke-width="1.2">
        <line x1="140" y1="5" x2="140" y2="40" />
        <path d="M 136 32 L 140 40 L 144 32" />
        <line x1="180" y1="5" x2="180" y2="40" />
        <path d="M 176 32 L 180 40 L 184 32" />
        <text x="148" y="0" font-family="monospace" font-size="9" fill="#d97706" stroke="none">kN/m²</text>
      </g>

      <!-- Structural Note -->
      <text x="60" y="225" font-family="monospace" font-size="9" fill="#475569" fill-opacity="0.7" stroke="none">RSJ 203x133x30 UB</text>
      <text x="60" y="238" font-family="monospace" font-size="8" fill="#64748b" fill-opacity="0.7" stroke="none">PADSTONE 440x215x100mm</text>
    </g>

    <!-- ============================================== -->
    <!-- 3. EXTENSION & ROOF SECTION (Bottom Area)      -->
    <!-- ============================================== -->
    <g transform="translate(80, 440)">
      <!-- Roof Pitch Diagram -->
      <polygon points="40,160 220,60 400,160" stroke-width="2" />
      <line x1="220" y1="60" x2="220" y2="160" stroke-width="1" stroke-dasharray="4,3" />
      <!-- Skylight Openings -->
      <rect x="110" y="100" width="45" height="35" transform="rotate(-29 110 100)" stroke-width="1.2" fill="#cbd5e1" fill-opacity="0.3" />
      <rect x="260" y="80" width="45" height="35" transform="rotate(29 260 80)" stroke-width="1.2" fill="#cbd5e1" fill-opacity="0.3" />

      <!-- Ceiling Joists & Foundation Depth -->
      <line x1="40" y1="160" x2="400" y2="160" stroke-width="2" />
      <line x1="40" y1="175" x2="400" y2="175" stroke-width="1" />
      <line x1="40" y1="160" x2="40" y2="260" stroke-width="2.5" />
      <line x1="400" y1="160" x2="400" y2="260" stroke-width="2.5" />
      
      <!-- Concrete Foundation Footings -->
      <rect x="15" y="260" width="65" height="30" stroke-width="1.5" fill="#94a3b8" fill-opacity="0.2" />
      <rect x="365" y="260" width="65" height="30" stroke-width="1.5" fill="#94a3b8" fill-opacity="0.2" />
      <!-- Foundation Hatch -->
      <line x1="20" y1="290" x2="40" y2="260" stroke-width="0.75" />
      <line x1="40" y1="290" x2="60" y2="260" stroke-width="0.75" />
      <line x1="370" y1="290" x2="390" y2="260" stroke-width="0.75" />
      <line x1="390" y1="290" x2="410" y2="260" stroke-width="0.75" />

      <!-- Section Height Markers -->
      <line x1="430" y1="60" x2="430" y2="260" stroke-width="0.75" />
      <line x1="422" y1="60" x2="438" y2="60" stroke-width="0.75" />
      <line x1="422" y1="160" x2="438" y2="160" stroke-width="0.75" />
      <line x1="422" y1="260" x2="438" y2="260" stroke-width="0.75" />
      <text x="445" y="115" font-family="monospace" font-size="9" fill="#475569" fill-opacity="0.7" stroke="none">2.45m RIDGE</text>
      <text x="445" y="215" font-family="monospace" font-size="9" fill="#475569" fill-opacity="0.7" stroke="none">2.70m CEILING</text>
      <text x="445" y="280" font-family="monospace" font-size="9" fill="#475569" fill-opacity="0.7" stroke="none">1.00m STRIP FOOTING</text>
    </g>

    <!-- ============================================== -->
    <!-- 4. NORTH ARROW & ARCHITECTURAL STAMP (Bottom-R)-->
    <!-- ============================================== -->
    <g transform="translate(620, 520)">
      <!-- North Compass Circle -->
      <circle cx="60" cy="60" r="35" stroke-width="1.2" />
      <circle cx="60" cy="60" r="32" stroke-width="0.5" stroke-dasharray="2,2" />
      <polygon points="60,30 66,60 60,54" fill="#334155" fill-opacity="0.6" stroke-width="0.5" />
      <polygon points="60,30 54,60 60,54" fill="none" stroke-width="0.5" />
      <polygon points="60,90 66,60 60,66" fill="none" stroke-width="0.5" />
      <polygon points="60,90 54,60 60,66" fill="#94a3b8" fill-opacity="0.4" stroke-width="0.5" />
      <text x="56" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" fill-opacity="0.8" stroke="none">N</text>

      <!-- Drawing Title Block Stamp -->
      <g transform="translate(-80, 120)">
        <rect x="0" y="0" width="220" height="85" stroke-width="1.2" fill="#ffffff" fill-opacity="0.5" />
        <line x1="0" y1="26" x2="220" y2="26" stroke-width="0.75" />
        <line x1="0" y1="52" x2="220" y2="52" stroke-width="0.75" />
        <line x1="110" y1="52" x2="110" y2="85" stroke-width="0.75" />
        <text x="10" y="18" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b" fill-opacity="0.8" stroke="none" letter-spacing="1">ST CONTRACTORS</text>
        <text x="10" y="42" font-family="monospace" font-size="9" fill="#475569" fill-opacity="0.7" stroke="none">PLANNING / SCHEMATIC GA</text>
        <text x="10" y="70" font-family="monospace" font-size="8" fill="#64748b" fill-opacity="0.7" stroke="none">SCALE: 1:50 @ A1</text>
        <text x="120" y="70" font-family="monospace" font-size="8" fill="#64748b" fill-opacity="0.7" stroke="none">DRG: ST-2026-01</text>
      </g>
    </g>
  </g>
</svg>
